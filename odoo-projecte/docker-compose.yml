version: '3.1'

services:
  db:
    image: postgres:15
    container_name: odoo-projecte-db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - odoo-projecte-db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:17
    container_name: odoo-projecte-app
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - odoo-projecte-web-data:/var/lib/odoo

volumes:
  odoo-projecte-db-data:
  odoo-projecte-web-data: